services:
  - type: web
    name: thaliwise-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - { key: PYTHON_VERSION, value: 3.11.9 }
      - { key: DATABASE_URL, sync: false }      # Neon / Render Postgres connection string
      - { key: CORS_ORIGINS, sync: false }      # your Vercel URL, e.g. https://thaliwise.vercel.app
      - { key: DATA_GOV_API_KEY, sync: false }  # optional, for live mandi prices
